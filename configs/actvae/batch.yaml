global:
  logging_params:
    log_dir: "logs/actvae"
    name: "cp-batch"

  schedules_path: "~/Data/foundata/out/nts/2023/activities.csv"
  attributes_path: "~/Data/foundata/out/nts/2023/attributes_binned.csv"

  evaluation_params:
    split_on: [age, sex, employment, hh_income, hh_zone, day, vehicles, access_egress_distance]

  encoder_params:
    name: "continuous"
    max_length: 16
    norm_duration: 1440
    jitter: 0
    fix_durations: stretch
    trim_eos: True
    weighting: unit
    joint_weighting: unit

  labels_encoder:
    name: "tokens"
    weighting: unit
    joint_weighting: inverse
    labels:
      age: nominal
      sex: nominal
      employment: nominal
      hh_income: nominal
      hh_zone: nominal
      day: nominal
      vehicles: nominal
      access_egress_distance: nominal

  loader_params:
    train_batch_size: 1024
    val_batch_size:  1024
    num_workers: 8
    val_split: 0.1

  trainer_params:
    min_epochs: 100
    patience: 50
    max_epochs: 200
    beta_scheduling:
      enabled: False
    collapse_monitoring:
      enabled: True

  experiment_params:
    LR: 0.001
    weight_decay: 0.01
    scheduler_gamma: 0.98
    kld_weight: 0.01
    duration_loss_weight: 200

nonenone:
  model_params:
    name: "CVAEContLSTMCP"
    hidden_n: 4
    hidden_size: 256
    labels_hidden_size: 64
    latent_dim: 6
    dropout: 0.0
    teacher_forcing_ratio: 0.5
    hidden_conditionality: none
    encoder_conditionality: none
    latent_conditionality: none
    decoder_conditionality: none

addadd:
  model_params:
    name: "CVAEContLSTMCP"
    hidden_n: 4
    hidden_size: 256
    labels_hidden_size: 64
    latent_dim: 6
    dropout: 0.0
    teacher_forcing_ratio: 0.5
    hidden_conditionality: add
    encoder_conditionality: none
    latent_conditionality: add
    decoder_conditionality: none

noneadd:
  model_params:
    name: "CVAEContLSTMCP"
    hidden_n: 4
    hidden_size: 256
    labels_hidden_size: 64
    latent_dim: 6
    dropout: 0.0
    teacher_forcing_ratio: 0.5
    hidden_conditionality: none
    encoder_conditionality: none
    latent_conditionality: add
    decoder_conditionality: none

addnone:
  model_params:
    name: "CVAEContLSTMCP"
    hidden_n: 4
    hidden_size: 256
    labels_hidden_size: 64
    latent_dim: 6
    dropout: 0.0
    teacher_forcing_ratio: 0.5
    hidden_conditionality: add
