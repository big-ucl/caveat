logging_params:
  log_dir: "logs/actvae2"
  name: "cvae"

schedules_path: "/home/fred/Projects/foundata/output/nts2023/activity_schedules.parquet"
attributes_path: "/home/fred/Projects/foundata/output/nts2023/binned_attributes.parquet"

evaluation_params:
  split_on: [age, sex, employment, hh_income, hh_zone, day, veh_per_adult, wt_travel_time_to_cities]
  split_order: 2
  
labels_encoder:
  name: "tokens"
  weighting: unit
  joint_weighting: inverse
  labels:
    age: nominal
    sex: nominal
    employment: nominal
    hh_income: nominal
    hh_zone: nominal
    day: nominal
    veh_per_adult: nominal
    wt_travel_time_to_cities: nominal

encoder_params:
  name: "continuous"
  max_length: 16
  norm_duration: 1440
  jitter: 0
  fix_durations: stretch
  trim_eos: True
  weighting: unit
  joint_weighting: unit

loader_params:
  train_batch_size: 1024
  val_batch_size:  1024
  num_workers: 8
  val_split: 0.1
  test_split: 0.1

trainer_params:
  min_epochs: 100
  patience: 50
  max_epochs: 300
  
model_params:
  name: "CVAEContLSTMCP"
  hidden_n: 4
  hidden_size: 256
  labels_hidden_size: 64
  latent_dim: 6
  dropout: 0.0
  teacher_forcing_ratio: 0.5
  hidden_conditionality: add
  encoder_conditionality: none
  latent_conditionality: add
  decoder_conditionality: none

experiment_params:
  LR: 0.001
  weight_decay: 0.01
  scheduler_gamma: 0.98
  kld_weight: 0.01
  duration_loss_weight: 200
