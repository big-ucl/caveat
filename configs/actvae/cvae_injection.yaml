seed: 12345
logging_params:
  log_dir: "logs/TRB"
  name: "cvae_countdown"

schedules_path: "/home/fred/Projects/foundata/output/nts2023/activity_schedules.parquet"
attributes_path: "/home/fred/Projects/foundata/output/nts2023/binned_attributes.parquet"

evaluation_params:
  split_on: [age, sex, employment, hh_income, hh_zone, day, veh_per_adult, wt_travel_time_to_cities]

labels_encoder:
  name: "tokens"
  weighting: unit
  joint_weighting: inverse
  labels:
    gender: nominal
    age_group: nominal
    car_access: nominal
    work_status: nominal
    income: nominal

encoder_params:
  name: "continuous"
  max_length: 16
  norm_duration: 1440
  jitter: 0
  fix_durations: "stretch"
  trim_eos: True
  weighting: unit
  joint_weighting: unit

loader_params:
  train_batch_size: 1024
  val_batch_size:  1024
  num_workers: 8
  val_split: 0.1
  test_split: 0.1

trainer_params:
  min_epochs: 100
  patience: 50
  max_epochs: 200

experiment_params:
  LR: 0.001
  weight_decay: 0.02
  scheduler_gamma: 0.975
  kld_weight: 0.01
  duration_loss_weight: 200

model_params:
  name: "CVAEContLSTMCountdown"
  hidden_n: 3
  hidden_size: 256
  labels_hidden_size: 32
  latent_dim: 6
  dropout: 0.1
  teacher_forcing_ratio: 0.5
  hidden_conditionality: add
  encoder_conditionality: concat
  latent_conditionality: add
  decoder_conditionality: concat
  act_head_depth:  2
  act_hidden_size: 32
  dur_head_depth: 2
  dur_hidden_size: 32
  budget_depth: 1
  budget_hidden_size: 32

