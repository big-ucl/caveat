global:
  logging_params:
    log_dir: "logs/actvae"
    name: "L_batch"

  schedules_path: "~/Data/foundata/out/nts/2023/activities.csv"
  attributes_path: "~/Data/foundata/out/nts/2023/attributes_binned.csv"

  evaluation_params:
    split_on: [age, sex, employment, hh_income, hh_zone, day, vehicles, access_egress_distance]

  encoder_params:
    name: "continuous"
    max_length: 16
    norm_duration: 1440
    jitter: 0
    fix_durations: stretch
    trim_eos: True
    weighting: unit
    joint_weighting: unit

  labels_encoder:
    name: "tokens"
    weighting: unit
    joint_weighting: inverse
    labels:
      age: nominal
      sex: nominal
      employment: nominal
      hh_income: nominal
      hh_zone: nominal
      day: nominal
      vehicles: nominal
      access_egress_distance: nominal

  loader_params:
    train_batch_size: 1024
    val_batch_size:  1024
    num_workers: 8
    val_split: 0.1

  trainer_params:
    min_epochs: 100
    patience: 50
    max_epochs: 300
    beta_scheduling:
      enabled: False

  experiment_params:
    LR: 0.001
    weight_decay: 0.02
    scheduler_gamma: 0.975
    kld_weight: 0.01
    duration_loss_weight: 200

