seed: 12345

logging_params:
  log_dir: "logs/TRB"
  name: "catvae"

schedules_path: "tmp/nts_schedules_2023.csv"
attributes_path: "tmp/nts_attributes_2023.csv"

loader_params:
  train_batch_size: 1024
  val_batch_size:  1024
  num_workers: 8

trainer_params:
  min_epochs: 20
  max_epochs: 200
  patience: 20

labels_encoder:
  name: "tokens"
  weighting: unit
  joint_weighting: unit
  labels:
    gender: nominal
    age_group: nominal
    car_access: nominal
    work_status: nominal
    income: nominal

evaluation_params:
  split_on: [gender, age_group, car_access, work_status, income]

encoder_params:
  name: "continuous"
  fix_durations: stretch
  max_length: 16
  duration: 1440
  jitter: 0.1
  weighting: unit
  joint_weighting: unit
  trim_eos: True

generator_params:
  batch_size: 1024

experiment_params:
  LR: 0.001
  weight_decay: 0.02
  scheduler_gamma: 0.975
  kld_weight: 0.001
  duration_loss_weight: 200
  
model_params:
  name: "CatVAEContLSTM"
  latent_dim: 128
  latent_categories: 32
  hidden_n: 4
  hidden_size: 256
  dropout: 0.1
  normalise_durations: True