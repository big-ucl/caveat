# tune:
#   trials: 200
#   prune: True
#   timeout:  72000 # seconds

seed: 12345

logging_params:
  log_dir: "logs/TRB"
  name: "vqvae"

# schedules_path: "tmp/nts_schedules_2023.csv"
# attributes_path: "tmp/nts_attributes_2023.csv"

schedules_path: "tests/fixtures/test_schedules.csv"
# attributes_path: "tests/fixtures/test_attributes.csv"

loader_params:
  train_batch_size: 1024
  val_batch_size:  1024
  num_workers: 8
  val_split: 0.1
  test_split: 0.1

trainer_params:
  min_epochs: 10
  max_epochs: 100
  patience: 10

encoder_params:
  name: "continuous"
  fix_durations: stretch
  max_length: 16
  duration: 1440
  jitter: 0.1
  weighting: unit
  joint_weighting: unit
  trim_eos: True

# labels_encoder:
#   name: "tokens"
#   weighting: unit
#   joint_weighting: unit
#   labels:
#     gender: nominal
#     age_group: nominal
#     car_access: nominal
#     work_status: nominal
#     income: nominal

# evaluation_params:
#   split_on: [gender, age_group, car_access, work_status, income]

experiment_params:
  LR: 0.001
  weight_decay: 0.02
  scheduler_gamma: 0.975
  kld_weight: 1
  duration_loss_weight: 200

model_params:
  name: "VQVAEContLSTM"
  latent_dim: 16
  hidden_n: 4
  hidden_size: 256
  dropout: 0.1
  num_embeddings: 10
  embedding_dim: 64
