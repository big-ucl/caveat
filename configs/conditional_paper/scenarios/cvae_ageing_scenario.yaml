global:
  seed: 12345
  logging_params:
    log_dir: "logs/TRB"
    name: "cvae_nomis_scenario"

  schedules_path: "tmp/nts_schedules_2023.csv"
  attributes_path: "tmp/nts_attributes_2023.csv"

  evaluation_params:
    split_on: [age_group]

  labels_encoder:
    name: "tokens"
    weighting: unit
    joint_weighting: inverse
    labels:
      age_group: nominal

  encoder_params:
    name: "continuous"
    max_length: 16
    norm_duration: 1440
    jitter: 0
    fix_durations: stretch
    trim_eos: True
    weighting: unit
    joint_weighting: unit

  loader_params:
    train_batch_size: 1024
    val_batch_size:  1024
    num_workers: 8
    val_split: 0.1
    test_split: 0.1

  trainer_params:
    min_epochs: 100
    patience: 50
    max_epochs: 300

  model_params:
    name: "CVAEContLSTM"
    hidden_n: 4
    hidden_size: 256
    labels_hidden_size: 64
    latent_dim: 6
    dropout: 0.0
    teacher_forcing_ratio: 0.5
    hidden_conditionality: add
    encoder_conditionality: none
    latent_conditionality: add
    decoder_conditionality: none

  experiment_params:
    LR: 0.001
    weight_decay: 0.02
    scheduler_gamma: 0.975
    kld_weight: 0.01
    duration_loss_weight: 200

a2023:
  synthetic_attributes_path: "tmp/nomis_ages_2023.csv"

a2030:
  synthetic_attributes_path: "tmp/nomis_ages_2030.csv"

a2040:
  synthetic_attributes_path: "tmp/nomis_ages_2040.csv"

a2050:
  synthetic_attributes_path: "tmp/nomis_ages_2050.csv"



