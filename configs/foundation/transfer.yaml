spatial_transfer:
  schedules_path: "tmp/foundation/filter/activities_2023.csv"
  attributes_path: "tmp/foundation/filter/attributes_2023.csv"
  labels_encoder:
    name: "tokens"
    weighting: unit
    joint_weighting: inverse
    labels:
      sex: nominal
      age: nominal
      day: nominal
      employment: nominal
      hh_income: nominal
      year: nominal

combined_transfer:
  schedules_path: "tmp/foundation/home_based_activities.csv"
  attributes_path: "tmp/foundation/binned_home_based_attributes.csv"
  labels_encoder:
    name: "tokens"
    weighting: unit
    joint_weighting: inverse
    labels:
      sex: nominal
      age: nominal
      day: nominal
      employment: nominal
      hh_income: nominal
      year: nominal