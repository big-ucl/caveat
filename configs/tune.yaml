seed: 12345

logging_params:
  log_dir: logs/TRB
  name: tune

tune:
  trials: 200
  prune: True
  timeout:  72000 # seconds

schedules_path: "tmp/nts_schedules_2023.csv"
attributes_path: "tmp/nts_attributes_2023.csv"

loader_params:
  train_batch_size: 1024
  val_batch_size:  1024
  num_workers: 8

trainer_params:
  min_epochs: 20
  max_epochs: 120
  patience: 20

encoder_params:
  name: "continuous"
  max_length: 16
  norm_duration: 1440
  jitter: 0
  fix_durations: "stretch"
  trim_eos: True
  weighting: unit
  joint_weighting: unit

labels_encoder:
  name: "tokens"
  weighting: unit
  joint_weighting: inverse
  labels:
    gender: nominal
    age_group: nominal
    car_access: nominal
    work_status: nominal
    income: nominal

evaluation_params:
  split_on: [gender, age_group, car_access, work_status, income]

experiment_params:
  LR: 0.001
  weight_decay: 0.02
  scheduler_gamma: 0.975
  kld_weight: 0.01
  duration_loss_weight: 200

model_params:
  name: "CVAEContLSTM"
  latent_dim: 6
  hidden_n: trial.suggest_int("hidden_n", 2, 4)
  hidden_size: trial.suggest_categorical("hidden_size", [128, 256, 512])
  labels_hidden_size: trial.suggest_categorical("labels_hidden_size", [16, 32, 64, 128, 256])
  dropout: 0
  teacher_forcing_ratio: 0.5
  hidden_conditionality: add
  encoder_conditionality: concat
  latent_conditionality: add
  decoder_conditionality: concat