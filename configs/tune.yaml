seed: 12345

logging_params:
  log_dir: logs/TRB
  name: tuneL16

tune:
  trials: 200
  prune: True
  timeout:  72000 # seconds

schedules_path: "tmp/nts_schedules_2023.csv"
attributes_path: "tmp/nts_attributes_2023.csv"

loader_params:
  train_batch_size: 1024
  val_batch_size:  1024
  num_workers: 8

trainer_params:
  min_epochs: 20
  max_epochs: 100
  patience: 20

encoder_params:
  name: "continuous"
  max_length: 16
  norm_duration: 1440
  jitter: 0
  fix_durations: True
  trim_eos: True
  weighting: unit
  joint_weighting: unit

labels_encoder:
  name: "tokens"
  weighting: unit
  joint_weighting: inverse
  labels:
    work_status: nominal
    area: nominal
    age_group: nominal
    mobility: nominal
    income: nominal
    education: nominal
    ethnicity: nominal
    gender: nominal
    car_access: nominal
    license: nominal
    WfH: nominal
    wheelchair_user: nominal
    ticket_holder: nominal
    health: nominal
    blue_badge: nominal
    num_license_holders: nominal

evaluation_params:
  split_on: [work_status]

experiment_params:
  LR: trial.suggest_float("LR", 1e-4, 0.01, log=True)
  weight_decay: 0.02
  scheduler_gamma: 0.975
  kld_weight: 0.01
  duration_loss_weight: 200

model_params:
  name: "CVAEContLSTM"
  latent_dim: 6
  hidden_n: trial.suggest_int("hidden_n", 2, 5)
  hidden_size: trial.suggest_categorical("hidden_size", [128, 256, 512])
  labels_hidden_size: trial.suggest_categorical("labels_hidden_size", [16, 32, 64, 128, 256])
  dropout: 0.1
  teacher_forcing_ratio: 0.5
  encoder_conditionality: both_concat
  latent_conditionality: add
  decoder_conditionality: inputs_concat