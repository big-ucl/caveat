seed: 12345

logging_params:
  log_dir: logs/vae_paper
  name: tune_50

tune:
  trials: 400
  prune: True
  timeout:  72000 # seconds

schedules_path: tmp/nts_schedules_2023_50.csv

loader_params:
  train_batch_size: 1024
  val_batch_size:  1024
  num_workers: 8

trainer_params:
  min_epochs: 50
  max_epochs: 150
  patience: 50

encoder_params:
  name: "continuous"
  fix_durations: True
  max_length: 16
  duration: 1440
  jitter: 0.1
  weighting: unit
  joint_weighting: unit
  trim_eos: True

experiment_params:
  LR: trial.suggest_float("LR", 1e-4, 0.01, log=True)
  weight_decay: 0.02
  scheduler_gamma: 0.975
  kld_weight: 0.01
  duration_loss_weight: 200

model_params:
  name: "VAEContLSTM"
  latent_dim: 6
  hidden_n: trial.suggest_int("hidden_n", 2, 4)
  hidden_size: trial.suggest_categorical("hidden_size", [32, 64, 128, 256])
  dropout: 0.1
  teacher_forcing_ratio: 0.5