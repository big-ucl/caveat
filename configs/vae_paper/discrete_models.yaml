global:
  seed: 1234
  logging_params:
    log_dir: "logs/discrete_models"
    name: "kernels"
  
  schedules_path: "tmp/nts_schedules_2023.csv"

  loader_params:
    train_batch_size: 1024
    val_batch_size:  1024
    num_workers: 8
  
  trainer_params:
    min_epochs: 50
    max_epochs: 150
    patience: 50

  encoder_params:
    name: "discrete"
    duration: 1440
    step_size: 10
    jitter: 0.1
    weighting: unit
    joint_weighting: unit

