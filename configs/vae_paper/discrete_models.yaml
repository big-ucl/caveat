rnna:
  encoder_params:
    name: "discrete"
    duration: 1440
    step_size: 10
    jitter: 0.1
    weighting: act_inverse
    joint_weighting: unit
  experiment_params:
    LR: 0.002
    weight_decay: 0.02
    scheduler_gamma: 0.975
    kld_weight: 0.01
  model_params:
    name: "VAEDiscLSTM"
    latent_dim: 6
    hidden_n: 4
    hidden_size: 512
    dropout: 0.1

