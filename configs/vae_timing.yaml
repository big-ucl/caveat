seed: 1234

logging_params:
  log_dir: "logs/timing"
  name: "VAEContLSTM_countdown_tune"

tune:
  trials: 500
  prune: True
  timeout:  1000000 # seconds

schedules_path: "tmp/nts_schedules_2023.csv"

loader_params:
  train_batch_size: 1024
  val_batch_size:  1024
  num_workers: 8

trainer_params:
  # detect_anomaly: True
  min_epochs: 20
  max_epochs: 150
  patience: 20
  # loss_scheduling:
  #   kld_loss_schedule: [0, 20]

# experiment_params:
#   debug: False
#   LR: trial.suggest_float("LR", 0.0001, 0.01, log=True)
#   weight_decay: trial.suggest_float("weight_decay", 0.0, 0.1)
#   scheduler_gamma: trial.suggest_float("scheduler_gamma", 0.9, 0.999, log=True)
#   kld_weight: 0.01
#   duration_loss_weight: 200
#   end_loss_weight: 0
#   total_duration_loss_weight: 0

experiment_params:
  debug: False
  LR: 0.005
  weight_decay: 0.01
  scheduler_gamma: 0.975
  kld_weight: 0.01
  duration_loss_weight: 200
  end_loss_weight: 0
  total_duration_loss_weight: 0

encoder_params:
  name: "continuous"
  fix_durations: "stretch"
  max_length: 16
  duration: 1440
  jitter: 0.0
  weighting: unit
  joint_weighting: unit
  trim_eos: True

model_params:
  name: "VAEContLSTMCountdown"
  latent_dim: 6
  hidden_n: 3
  hidden_size: 128
  dropout: 0
  normalise_durations: True
  act_head_depth: trial.suggest_int("head_n", 1, 3)
  act_hidden_size: trial.suggest_categorical("head_hidden_size", [4, 8, 16, 32, 64, 128, 256])
  dur_head_depth: trial.suggest_int("dur_head_n", 1, 3)
  dur_hidden_size: trial.suggest_categorical("dur_head_hidden_size", [4, 8, 16, 32, 64, 128, 256])
  budget_depth: trial.suggest_int("budget_depth", 0, 3)
  budget_hidden_size: trial.suggest_categorical("budget_hidden_size", [4, 8, 16, 32, 64, 128, 256])

model_params:
  name: "VAEContLSTMCountdown"
  latent_dim: 6
  hidden_n: 3
  hidden_size: 128
  dropout: 0.01
  normalise_durations: True
  act_head_depth: 1
  act_hidden_size: 128
  dur_head_depth: 2
  dur_hidden_size: 16
  budget_depth: 1
  budget_hidden_size: 16
